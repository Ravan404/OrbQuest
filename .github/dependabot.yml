version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Types must match the oldest supported Node.js (22), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
