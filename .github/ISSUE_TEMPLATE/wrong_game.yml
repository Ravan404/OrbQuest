name: Wrong or missing game
description: A quest game has the wrong .exe or icon, or is missing from the database
labels: [quest-database]
body:
  - type: input
    id: game
    attributes:
      label: Game
    validations:
      required: true
  - type: input
    id: exe
    attributes:
      label: Correct executable
      placeholder: VALORANT-Win64-Shipping.exe
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong, and a link to the quest or a r/DiscordQuests post if you have one.
