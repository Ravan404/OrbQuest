name: Catalog problem
description: A quest game is missing from the featured games, or the wrong executable is chosen for it
labels: [catalog]
body:
  - type: input
    id: game
    attributes:
      label: Game
    validations:
      required: true
  - type: input
    id: exe
    attributes:
      label: Executable the quest needs
      placeholder: win64/valorant-win64-shipping.exe
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong. A game missing from Discord's own list cannot be added to the catalog, but it can be added by hand with Add game.
