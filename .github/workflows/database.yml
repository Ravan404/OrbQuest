name: Game database

# Rebuilds src/server/gameDatabase.json from Discord's list of detectable
# games every six hours and commits it to main when it changed. Every
# OrbQuest install downloads that compact file (src/server/publishedDatabase.ts)
# instead of Discord's full list.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Discord is sometimes briefly unreachable. A missed run is only a
      # warning; the next one catches up.
      - name: Read Discord's list of detectable games
        id: fetch
        continue-on-error: true
        run: npm run update-database

      - name: Warn about a missed update
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning::Discord's list could not be read. The next scheduled run tries again."

      # A list that suddenly lost many games is more likely a fault on
      # Discord's side than real removals: stop before it reaches the users.
      - name: Check the rebuilt database
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import { execSync } from 'node:child_process';
          const file = 'src/server/gameDatabase.json';
          const next = JSON.parse(fs.readFileSync(file, 'utf8'));
          const before = JSON.parse(execSync('git show HEAD:' + file, { encoding: 'utf8' }));
          if (!Array.isArray(next.games) || next.games.some((g) => !g.id || !g.name || !g.executables?.length)) {
            throw new Error('The database has malformed games.');
          }
          if (next.games.length < before.games.length * 0.9) {
            throw new Error('The database shrank from ' + before.games.length + ' to ' + next.games.length + ' games.');
          }
          console.log('Games: ' + before.games.length + ' -> ' + next.games.length);
          "

      - name: Tests
        run: npm test

      - name: Commit the update
        run: |
          if git diff --quiet; then
            echo "The database did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/gameDatabase.json
          git commit -m "chore(data): update the game database from Discord"
          git push
