name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Lint and format check (Biome)
        run: npm run lint

      - name: Tests (node:test, offline)
        run: npm test

      - name: Production build (vite + esbuild server bundle)
        run: npm run build

      - name: Verify the production bundle (versions, offline game database, static guard)
        run: npm run verify:dist

  e2e:
    name: Browser test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      # Clicks through the built app in Edge and really starts placeholders.
      - name: Browser test
        env:
          E2E_SCREENSHOTS: e2e-screenshots
        run: npm run test:e2e

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-screenshots

  packages:
    name: Windows packages (installer and portable exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Build the installer and the portable exe
        shell: cmd
        run: scripts\build-windows.bat

      - name: Install, start and uninstall the packages
        shell: pwsh
        run: ./scripts/smoke-test-package.ps1

  placeholder:
    name: Placeholder matches its source
    runs-on: windows-latest
    env:
      # The pinned toolchain of scripts/build-placeholder.bat; its build is
      # byte-for-byte reproducible, so the result must equal the committed exe.
      WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.7z
      WINLIBS_SHA256: db014a73b71907c6c778fd1c938056cddcae9023f89f8dfff7783d9e45baf975
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache the toolchain
        id: winlibs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\winlibs
          key: winlibs-${{ env.WINLIBS_SHA256 }}

      - name: Download WinLibs GCC 16.2.0 UCRT r3
        if: steps.winlibs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs.7z'
          Invoke-WebRequest $env:WINLIBS_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINLIBS_SHA256) { throw "Unexpected toolchain archive: $hash" }
          7z x $archive "-o$env:RUNNER_TEMP\winlibs" | Out-Null

      - name: Build placeholder_runtime.exe and compare it with the committed one
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\winlibs\mingw64\bin;$env:PATH"
          gcc --version | Select-Object -First 1
          cmd /c scripts\build-placeholder.bat --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the result is a 64-bit Windows GUI program
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD 'build/placeholder_runtime.exe'))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a PE file' }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($machine -ne 0x8664) { throw "Expected x64, got machine 0x$($machine.ToString('X'))" }
          if ($subsystem -ne 2) { throw "Expected the Windows GUI subsystem, got $subsystem" }
          Write-Host "build/placeholder_runtime.exe: $($bytes.Length) bytes, x64, GUI subsystem"
