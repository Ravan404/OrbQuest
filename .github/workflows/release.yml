name: Release

# Push a tag such as v1.6.1 (after `npm run bump-version -- 1.6.1`) to build the
# Windows packages (OrbQuest-Setup-<version>.exe, the portable
# OrbQuest-<version>.exe and SHA256SUMS.txt) and attach them to a draft GitHub
# release. Review the draft and publish it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version. Run npm run bump-version -- <version> first."
          }

      # The newest database is on the database branch (see database.yml).
      - name: Take the published database
        shell: bash
        run: |
          if git fetch --depth=1 origin +refs/heads/database:refs/remotes/origin/database; then
            git checkout origin/database -- src/server/gameDatabase.json
          else
            echo "No database branch yet; building with the database on main."
          fi

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and the portable exe
        shell: cmd
        run: .\build_windows_exe.bat

      - name: Install, start and uninstall the packages
        shell: pwsh
        run: ./scripts/smoke-test-package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OrbQuest-windows
          path: |
            release/OrbQuest-*.exe
            release/SHA256SUMS.txt

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = @"
          **OrbQuest-Setup-$version.exe** installs OrbQuest for your Windows user (no administrator rights) with a Start menu entry; OrbQuest then updates itself. **OrbQuest-$version.exe** is the portable version: one file that runs from any folder.

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for what changed. SHA256SUMS.txt lists the SHA-256 of both files.
          "@
          gh release create '${{ github.ref_name }}' release/OrbQuest-Setup-$version.exe release/OrbQuest-$version.exe release/SHA256SUMS.txt `
            --draft --title 'OrbQuest ${{ github.ref_name }}' --notes $notes
